<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <script>
        // Redirection immédiate si l'utilisateur n'est pas connecté
        if (!localStorage.getItem('active_user')) {
            window.location.href = '/profil';
        }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ORIA – Synthèse 360° du Dossier Patient">
    <title>ORIA – Synthèse Dossier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style_v2.css?v=1005">
    
    <style>
        html, body {
            min-height: 100vh !important;
            margin: 0;
            display: flex !important;
            flex-direction: column !important;
        }

        .dossier-details-container {
            max-width: 1450px;
            margin: 2rem auto;
            padding: 0 2rem 3rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
            flex: 1 0 auto !important;
            width: 100%;
        }

        .back-nav {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.88rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
            width: fit-content;
        }

        .back-nav:hover {
            color: var(--accent-blue);
            transform: translateX(-3px);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dossier-grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 1.5rem;
            align-items: start;
        }

        @media (max-width: 900px) {
            .dossier-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header id="dashboard-header">
        <div class="header-content">
            <div class="logo-group">
                <img src="/static/logo.png" alt="Logo ORIA" class="logo-img">
            </div>
            <div class="header-title-center">
                <h2 class="subtitle">Synthèse Dossier 360°</h2>
            </div>
            <div style="display: flex; align-items: center; gap: 1rem;">
                <button id="theme-toggle" class="btn-primary" style="background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-glass); padding: 0.5rem; box-shadow: none; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer;">
                    <!-- L'icône sera injectée par JS -->
                </button>
                <!-- Menu Hamburger -->
                <div style="position: relative;">
                    <button id="menu-toggle" class="btn-primary" style="background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-glass); padding: 0.5rem; box-shadow: none; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
                    </button>
                    <!-- Dropdown Menu -->
                    <div id="dropdown-menu" class="dropdown-menu hidden">
                        <a href="/profil" class="dropdown-item" title="Accéder à mon profil">
                            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            Mon profil
                        </a>
                        <a href="/orienter" class="dropdown-item">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
                            Moteur d'orientation
                        </a>
                        <a href="/remplir" class="dropdown-item">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
                            Remplir ma fiche d'orientation / grille
                        </a>
                        <a href="/dashboard" class="dropdown-item">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                            Tableau de bord
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="dossier-details-container">
        
        <a href="/profil" class="back-nav">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            Retour aux dossiers
        </a>

        <!-- Carte Titre Patient -->
        <div style="background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: var(--radius); padding: 1.75rem; box-shadow: var(--shadow-card); backdrop-filter: blur(12px); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1.5rem; animation: fadeInUp 0.4s ease;">
            <div>
                <span id="senior-id-label" style="font-size: 0.82rem; font-weight: 700; color: var(--accent-blue); letter-spacing: 0.05em; text-transform: uppercase;">Dossier</span>
                <h1 id="senior-display-name" style="font-size: 1.8rem; font-weight: 800; color: var(--text-primary); margin: 0.2rem 0 0 0;">Chargement...</h1>
            </div>
            <div id="dossier-creator-badge" style="font-size: 0.88rem; color: var(--text-secondary); background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-glass); padding: 0.5rem 1rem; border-radius: 8px;">
                Créateur : --
            </div>
        </div>

        <!-- Zone Détails 360° -->
        <div id="dossier-view-content">
            <div style="padding: 5rem; text-align: center; color: var(--text-muted); font-size: 1.1rem;">
                Chargement des données cliniques...
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer id="dashboard-footer">
        <p>Prototype ORIA – Synthèse 360° du Dossier Patient</p>
    </footer>

    <script>
        // Extraire l'ID du dossier du chemin de l'URL
        const pathParts = window.location.pathname.split('/');
        const dossierId = pathParts[pathParts.length - 1];
        let currentDossierData = null;

        // Sécurité Restreinte (Patient / Aidant)
        function checkDossierAuthorization(data) {
            const activeUserJson = localStorage.getItem('active_user');
            if (activeUserJson) {
                const user = JSON.parse(activeUserJson);
                if (user.access === 'restricted') {
                    const patientName = user.patientName || "Robert Bernard";
                    let seniorNom = "";
                    const comids = data.comid || [];
                    const zarits = data.zarit || [];
                    
                    if (comids.length > 0 && comids[0].senior_nom) seniorNom = comids[0].senior_nom;
                    else if (zarits.length > 0 && zarits[0].senior_nom) seniorNom = zarits[0].senior_nom;
                    else if (data.orientation && data.orientation.donnees_extraites) {
                        const dEx = data.orientation.donnees_extraites;
                        const nom_u = dEx["usager.identite.nom"] || dEx["usager_nom_usage"] || "";
                        const prenom_u = dEx["usager.identite.prenom"] || dEx["usager_prenoms"] || "";
                        seniorNom = `${prenom_u} ${nom_u}`.trim();
                    }

                    if (!seniorNom.toLowerCase().includes(patientName.toLowerCase())) {
                        alert("Accès refusé : vous n'avez pas l'autorisation de voir ce dossier.");
                        window.location.href = '/profil';
                    }
                }
            }
        }

        async function loadDossierDetails() {
            const container = document.getElementById('dossier-view-content');
            try {
                const res = await fetch(`/api/dossier-360/${encodeURIComponent(dossierId)}`);
                if (!res.ok) throw new Error("Erreur serveur");
                const data = await res.json();
                currentDossierData = data;

                // Vérifier l'autorisation d'accès
                checkDossierAuthorization(data);

                const orient = data.orientation;
                const comids = data.comid || [];
                const zarits = data.zarit || [];

                let seniorNom = `Senior (Dossier #${dossierId})`;
                let creatorName = "Inconnu";
                if (comids.length > 0 && comids[0].senior_nom) seniorNom = comids[0].senior_nom;
                else if (zarits.length > 0 && zarits[0].senior_nom) seniorNom = zarits[0].senior_nom;
                else if (orient && orient.donnees_extraites) {
                    const dEx = orient.donnees_extraites;
                    const nom_u = dEx["usager.identite.nom"] || dEx["usager_nom_usage"] || "";
                    const prenom_u = dEx["usager.identite.prenom"] || dEx["usager_prenoms"] || "";
                    if (nom_u || prenom_u) seniorNom = `${prenom_u} ${nom_u}`.trim();
                }

                if (orient && orient.details_complet) {
                    creatorName = orient.details_complet.createur || "Anonyme";
                } else if (comids.length > 0) {
                    creatorName = comids[0].createur || "Anonyme";
                } else if (zarits.length > 0) {
                    creatorName = zarits[0].createur || "Anonyme";
                }

                document.getElementById('senior-id-label').textContent = `Dossier #${dossierId}`;
                document.getElementById('senior-display-name').textContent = seniorNom;
                document.getElementById('dossier-creator-badge').textContent = `Créateur : ${creatorName}`;

                // --- COMID HTML ---
                let comidHtml = '<div style="color: var(--text-muted); font-size: 0.88rem; font-style: italic; padding: 0.5rem 0;">Aucune évaluation COMID enregistrée.</div>';
                if (comids.length > 0) {
                    const entree = comids.find(c => c.type_eval === 'entree');
                    const sortie = comids.find(c => c.type_eval === 'sortie');
                    let scoreDelta = '';

                    if (entree && sortie) {
                        const diff = entree.score - sortie.score;
                        if (diff > 0) scoreDelta = `<div style="margin-top: 0.6rem; font-weight: 700; color: #10b981; font-size: 0.85rem;">Baisse de complexité : -${diff} pts (${Math.round((diff/entree.score)*100)}%)</div>`;
                        else if (diff < 0) scoreDelta = `<div style="margin-top: 0.6rem; font-weight: 700; color: #ef4444; font-size: 0.85rem;">Augmentation de complexité : +${Math.abs(diff)} pts</div>`;
                        else scoreDelta = `<div style="margin-top: 0.6rem; color: #94a3b8; font-size: 0.85rem;">Complexité stable</div>`;
                    }

                    const entreeBox = entree ? `
                        <div style="background: rgba(59, 130, 246, 0.06); padding: 0.85rem; border-radius: 8px; border: 1px solid rgba(59, 130, 246, 0.2);">
                            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; font-weight: 700; color: #3b82f6;">
                                <span>COMID ADMISSION (ENTRÉE)</span>
                                <span style="color: var(--text-muted); font-weight: 500;">${entree.date_creation || ''}</span>
                            </div>
                            <div style="font-size: 1.25rem; font-weight: 800; color: var(--text-primary); margin: 0.35rem 0;">
                                ${entree.score} / 30 <span style="font-size: 0.85rem; font-weight: 500; color: var(--text-secondary);">(${entree.niveau})</span>
                            </div>
                            <button type="button" onclick="downloadComidPDF('entree')" class="btn-primary" style="margin-top: 0.35rem; background: #3b82f6; color: #ffffff; padding: 0.35rem 0.75rem; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; border: none; box-shadow: none;">
                                Télécharger PDF COMID Entrée
                            </button>
                        </div>
                    ` : '';

                    const sortieBox = sortie ? `
                        <div style="background: rgba(59, 130, 246, 0.06); padding: 0.85rem; border-radius: 8px; border: 1px solid rgba(59, 130, 246, 0.2);">
                            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; font-weight: 700; color: #3b82f6;">
                                <span>COMID SORTIE (ÉVALUATION)</span>
                                <span style="color: var(--text-muted); font-weight: 500;">${sortie.date_creation || ''}</span>
                            </div>
                            <div style="font-size: 1.25rem; font-weight: 800; color: var(--text-primary); margin: 0.35rem 0;">
                                ${sortie.score} / 30 <span style="font-size: 0.85rem; font-weight: 500; color: var(--text-secondary);">(${sortie.niveau})</span>
                            </div>
                            <button type="button" onclick="downloadComidPDF('sortie')" class="btn-primary" style="margin-top: 0.35rem; background: #3b82f6; color: #ffffff; padding: 0.35rem 0.75rem; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; border: none; box-shadow: none;">
                                Télécharger PDF COMID Sortie
                            </button>
                        </div>
                    ` : '';

                    comidHtml = `
                        <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                            ${entreeBox}
                            ${sortieBox || '<div style="background: rgba(148, 163, 184, 0.05); padding: 0.85rem; border-radius: 8px; border: 1px dashed rgba(148, 163, 184, 0.2); color: var(--text-muted); font-size: 0.82rem; text-align: center;">En attente de sortie...</div>'}
                            ${scoreDelta}
                        </div>
                    `;
                }

                // --- ZARIT HTML ---
                let zaritHtml = '<div style="color: var(--text-muted); font-size: 0.88rem; font-style: italic; padding: 0.5rem 0;">Aucune grille ZARIT rattachée.</div>';
                if (zarits.length > 0) {
                    const z = zarits[0];
                    let badgeColor = "#22c55e";
                    if (z.score > 60) badgeColor = "#ef4444";
                    else if (z.score >= 41) badgeColor = "#f59e0b";
                    else if (z.score >= 21) badgeColor = "#3b82f6";

                    zaritHtml = `
                        <div style="background: rgba(245, 158, 11, 0.06); padding: 1rem; border-radius: 8px; border: 1px solid rgba(245, 158, 11, 0.2);">
                            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; font-weight: 700; color: #f59e0b;">
                                <span>AIDANT : ${z.aidant_nom || 'Aidant familial'}</span>
                                <span style="color: var(--text-muted); font-weight: 500;">${z.date_creation || ''}</span>
                            </div>
                            <div style="font-size: 1.35rem; font-weight: 800; color: var(--text-primary); margin: 0.4rem 0;">
                                ${z.score} <span style="font-size: 0.85rem; color: var(--text-muted);">/ 88</span>
                                <span style="font-size: 0.78rem; padding: 0.2rem 0.6rem; border-radius: 12px; background: ${badgeColor}22; color: ${badgeColor}; font-weight: 700; margin-left: 0.5rem;">${z.niveau}</span>
                            </div>
                            <button type="button" onclick="downloadZaritPDF()" class="btn-primary" style="margin-top: 0.6rem; background: var(--accent-amber); color: #ffffff; padding: 0.45rem 0.85rem; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; border: none; box-shadow: none;">
                                Télécharger le PDF Zarit
                            </button>
                        </div>
                    `;
                }

                // --- ORIENTATION & FICHES PDF ---
                let savedPdfsHtml = '';
                const savedPdfs = data.saved_pdfs || [];
                if (savedPdfs.length > 0) {
                    savedPdfsHtml = '<div style="margin-top: 0.8rem; border-top: 1px dashed var(--border-glass); padding-top: 0.8rem;">';
                    savedPdfsHtml += '<strong style="color: var(--text-primary); display: block; margin-bottom: 0.4rem;">Fiches remplies et enregistrées dans ce dossier :</strong>';
                    savedPdfsHtml += '<div style="display: flex; flex-direction: column; gap: 0.5rem;">';
                    savedPdfs.forEach(filename => {
                        let displayName = filename.replace('.pdf', '').replace(/_/g, ' ');
                        displayName = displayName.replace('fiche orientation ', '');
                        displayName = displayName.split(' dossier ')[0]; // Rendre le libellé court
                        displayName = displayName.toUpperCase();
                        savedPdfsHtml += `
                            <a href="/api/dossiers/${dossierId}/saved-pdf/${filename}" target="_blank" class="btn-primary" style="padding: 0.5rem 0.85rem; border-radius: 6px; font-size: 0.82rem; font-weight: 600; text-decoration: none; text-align: center; background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.25); box-shadow: none; display: flex; align-items: center; justify-content: center; gap: 0.4rem; transition: all 0.2s;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                                <span>Ouvrir ${displayName}</span>
                            </a>
                        `;
                    });
                    savedPdfsHtml += '</div></div>';
                }

                let orientCardsHtml = '';
                const historique = (orient && orient.details_complet && orient.details_complet.historique_orientations) ? orient.details_complet.historique_orientations : [];
                const sortedHistory = [...historique].reverse();

                if (sortedHistory.length > 0) {
                    sortedHistory.forEach((h, index) => {
                        const hStructs = h.structures_orientations || [];
                        const hStructsText = hStructs.map(s => s.type || s.nom).join(', ');
                        const dateStr = h.date || '';
                        const isLatest = index === 0;
                        
                        let structsBadges = hStructs.map(s => `<span style="display: inline-block; background: rgba(59, 130, 246, 0.15); color: #3b82f6; padding: 0.25rem 0.6rem; border-radius: 6px; font-weight: 600; font-size: 0.82rem; margin: 0.2rem;">${s.type || s.nom}</span>`).join(' ');
                        
                        const valUser = h.validation_utilisateur;
                        let validationStatusHtml = '<span style="color: var(--text-muted); font-style: italic;">En attente de validation</span>';
                        if (valUser) {
                            const dateVal = valUser.date_validation ? ` le ${valUser.date_validation}` : '';
                            const isAccepted = valUser.status && (valUser.status.toLowerCase().includes('valid') || valUser.status.toLowerCase().includes('accept'));
                            if (isAccepted) {
                                validationStatusHtml = `<span style="color: #10b981; font-weight: 700;">✅ Acceptée (${valUser.structure_choisie})</span><span style="color: var(--text-muted); font-size: 0.75rem; display: block; margin-top: 0.15rem;">Orienté${dateVal}</span>`;
                            } else {
                                validationStatusHtml = `<span style="color: #ef4444; font-weight: 700;">❌ Refusée</span><span style="color: var(--text-muted); font-size: 0.75rem; display: block; margin-top: 0.15rem;">Refusé${dateVal}</span>`;
                            }
                        }
                        
                        let pdfButtonsHtml = '';
                        if (hStructs.length > 0) {
                            pdfButtonsHtml = '<div style="margin-top: 0.8rem; display: flex; flex-direction: column; gap: 0.5rem;">';
                            hStructs.forEach(s => {
                                const rawName = s.nom || s.type || '';
                                const nameLower = rawName.toLowerCase();
                                let endpointType = '';
                                let btnLabel = '';

                                if (nameLower.includes('dac')) {
                                    endpointType = 'dac';
                                    btnLabel = "Télécharger Fiche DAC";
                                } else if (nameLower.includes('seyne')) {
                                    endpointType = 'laseyne';
                                    btnLabel = "Télécharger Fiche CLIC La Seyne";
                                } else if (nameLower.includes('toulon')) {
                                    endpointType = 'toulon';
                                    btnLabel = "Télécharger Fiche CLIC Toulon";
                                } else if (nameLower.includes('provence')) {
                                    endpointType = 'provence_verte';
                                    btnLabel = "Télécharger Fiche CLIC Provence Verte";
                                } else if (nameLower.includes('hadage')) {
                                    endpointType = 'hadage';
                                    btnLabel = "Télécharger Fiche CLIC Hadage";
                                }

                                if (endpointType) {
                                    pdfButtonsHtml += `
                                        <a href="/api/dossiers/${dossierId}/pdf/${endpointType}" target="_blank" class="btn-primary" style="padding: 0.5rem 0.85rem; border-radius: 6px; font-size: 0.82rem; font-weight: 600; text-decoration: none; text-align: center; background: rgba(59, 130, 246, 0.1); color: var(--accent-blue); border: 1px solid rgba(59, 130, 246, 0.25); box-shadow: none; display: flex; align-items: center; justify-content: center; gap: 0.4rem; transition: all 0.2s;">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                            <span>${btnLabel}</span>
                                        </a>
                                    `;
                                }
                            });
                            pdfButtonsHtml += '</div>';
                        }
                        
                        orientCardsHtml += `
                            <div style="background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: 10px; margin-bottom: 0.85rem; overflow: hidden;">
                                <div onclick="toggleHistoryCard(${index})" style="padding: 1rem 1.25rem; background: rgba(255, 255, 255, 0.02); display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; border-bottom: ${isLatest ? '1px solid var(--border-glass)' : 'none'};" id="history-header-${index}">
                                    <div style="display: flex; flex-direction: column; gap: 0.25rem;">
                                        <div style="font-size: 0.95rem; font-weight: 700; color: var(--text-primary); text-align: left;">
                                            Orientation du ${dateStr} ${isLatest ? '<span style="font-size: 0.72rem; padding: 0.1rem 0.4rem; background: rgba(16, 185, 129, 0.15); color: #10b981; border-radius: 12px; font-weight: 700; margin-left: 0.5rem;">Dernière en date</span>' : ''}
                                        </div>
                                        <div style="font-size: 0.8rem; color: var(--text-secondary); display: flex; align-items: center; flex-wrap: wrap;">
                                            <span style="margin-right: 0.35rem;">Structures :</span> ${hStructsText ? hStructsText : 'Aucune'}
                                        </div>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 1rem;">
                                        <div style="text-align: right; font-size: 0.8rem;">
                                            ${valUser ? (valUser.status.includes('valid') || valUser.status.includes('accept') ? '<span style="color: #10b981; font-weight: 600;">✅ Acceptée</span>' : '<span style="color: #ef4444; font-weight: 600;">❌ Refusée</span>') : '<span style="color: var(--text-muted); font-style: italic;">⏳ En attente</span>'}
                                        </div>
                                        <span id="history-arrow-${index}" style="font-size: 1rem; color: var(--text-muted); transition: transform 0.25s ease; transform: ${isLatest ? 'rotate(90deg)' : 'rotate(0deg)'};">▶</span>
                                    </div>
                                </div>
                                <div id="history-body-${index}" style="padding: 1.25rem; display: ${isLatest ? 'block' : 'none'}; border-top: 1px solid var(--border-glass);">
                                    <div style="display: grid; grid-template-columns: 1fr; gap: 0.85rem; font-size: 0.88rem; text-align: left;">
                                        <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 0.5rem;">
                                            <div>
                                                <span style="font-weight: 600; color: var(--text-secondary);">Statut de validation :</span>
                                                <div style="margin-top: 0.15rem;">${validationStatusHtml}</div>
                                            </div>
                                            <div>
                                                <span style="font-weight: 600; color: var(--text-secondary);">Structures préconisées :</span>
                                                <div style="margin-top: 0.15rem;">${structsBadges || 'Aucune'}</div>
                                            </div>
                                        </div>
                                        
                                        ${h.texte_original ? `
                                            <div style="margin-top: 0.35rem;">
                                                <span style="font-weight: 600; color: var(--text-secondary);">Situation clinique décrite :</span>
                                                <div style="margin-top: 0.35rem; padding: 0.75rem; background: var(--bg-primary); border-radius: 6px; font-style: italic; color: var(--text-secondary); max-height: 200px; overflow-y: auto; border: 1px solid var(--border-glass);">
                                                    "${h.texte_original}"
                                                </div>
                                            </div>
                                        ` : ''}
                                        
                                        <div style="margin-top: 0.35rem;">
                                            <span style="font-weight: 600; color: var(--text-secondary);">Fiches d'Orientation disponibles :</span>
                                            ${pdfButtonsHtml || '<div style="font-size: 0.8rem; color: var(--text-muted); font-style: italic; margin-top: 0.2rem;">Aucune fiche disponible.</div>'}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    orientCardsHtml = `
                        <div style="background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: 12px; padding: 1.5rem; text-align: center; color: var(--text-muted); font-style: italic;">
                            Aucune orientation ni récit clinique rattaché à ce dossier.
                        </div>
                    `;
                }

                // --- RENDU FINAL DE LA FICHE ---
                container.innerHTML = `
                    <div class="dossier-grid">
                        
                        <!-- Colonne de Gauche : Orientations et Fiches -->
                        <div style="display: flex; flex-direction: column; gap: 1.5rem;">
                            <!-- Carte de l'Historique des Orientations -->
                            <div style="background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: 12px; padding: 1.25rem; box-shadow: var(--shadow-card); backdrop-filter: blur(12px);">
                                <h4 style="font-size: 1.15rem; font-weight: 700; color: var(--text-primary); margin-bottom: 0.85rem; border-bottom: 1px solid var(--border-glass); padding-bottom: 0.5rem; text-align: left;">
                                    Historique des Orientations
                                </h4>
                                <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                                    ${orientCardsHtml}
                                </div>
                            </div>

                            <!-- Fichiers PDF Enregistrés -->
                            ${savedPdfs.length > 0 ? `
                                <div style="background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: 12px; padding: 1.25rem; box-shadow: var(--shadow-card); backdrop-filter: blur(12px);">
                                    <h4 style="font-size: 1.15rem; font-weight: 700; color: var(--text-primary); margin-bottom: 0.85rem; border-bottom: 1px solid var(--border-glass); padding-bottom: 0.5rem; text-align: left;">
                                        Documents PDF du Dossier
                                    </h4>
                                    ${savedPdfsHtml}
                                </div>
                            ` : ''}
                        </div>

                        <!-- Colonne de Droite : Bilans & Grilles -->
                        <div style="display: flex; flex-direction: column; gap: 1.5rem;">
                            <!-- Carte COMID -->
                            <div style="background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: 12px; padding: 1.25rem; box-shadow: var(--shadow-card); backdrop-filter: blur(12px);">
                                <h4 style="font-size: 1.15rem; font-weight: 700; color: var(--text-primary); margin-bottom: 0.85rem; border-bottom: 1px solid var(--border-glass); padding-bottom: 0.5rem; text-align: left;">
                                    Bilan Clinique COMID
                                </h4>
                                ${comidHtml}
                            </div>

                            <!-- Carte ZARIT -->
                            <div style="background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: 12px; padding: 1.25rem; box-shadow: var(--shadow-card); backdrop-filter: blur(12px);">
                                <h4 style="font-size: 1.15rem; font-weight: 700; color: var(--text-primary); margin-bottom: 0.85rem; border-bottom: 1px solid var(--border-glass); padding-bottom: 0.5rem; text-align: left;">
                                    Épuisement Aidant ZARIT
                                </h4>
                                ${zaritHtml}
                            </div>
                        </div>

                    </div>
                `;

            } catch (e) {
                console.error("Erreur", e);
                container.innerHTML = `<div style="padding: 2.5rem; color: #ef4444; text-align: center;">Erreur lors du chargement des détails du dossier.</div>`;
            }
        }

        window.toggleHistoryCard = function(index) {
            const body = document.getElementById(`history-body-${index}`);
            const arrow = document.getElementById(`history-arrow-${index}`);
            const header = document.getElementById(`history-header-${index}`);
            if (body && arrow) {
                const isCollapsed = body.style.display === 'none';
                body.style.display = isCollapsed ? 'block' : 'none';
                arrow.style.transform = isCollapsed ? 'rotate(90deg)' : 'rotate(0deg)';
                if (header) {
                    header.style.borderBottom = isCollapsed ? '1px solid var(--border-glass)' : 'none';
                }
            }
        };

        // --- TÉLÉCHARGEMENT PDF COMID & ZARIT ---
        async function downloadComidPDF(type) {
            if (!currentDossierData) return;
            const evalData = (currentDossierData.comid || []).find(c => c.type_eval === type);
            if (!evalData) return;

            try {
                let criteres = evalData.criteres || [];
                if (typeof evalData.criteres_json === 'string') {
                    try { criteres = JSON.parse(evalData.criteres_json); } catch(e){}
                }

                const payload = {
                    score: evalData.score || 0,
                    level: evalData.niveau || 'Non complexe',
                    date: evalData.date_creation || '',
                    checkedItems: criteres,
                    dossier_id: evalData.dossier_id || '',
                    senior_nom: evalData.senior_nom || ''
                };

                const res = await fetch('/api/comid/generate_pdf', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    const blob = await res.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `Synthese_COMID_${evalData.dossier_id}_${type.toUpperCase()}.pdf`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(url);
                }
            } catch(e) {
                console.error(e);
            }
        }

        async function downloadZaritPDF() {
            if (!currentDossierData || !(currentDossierData.zarit || []).length) return;
            const zData = currentDossierData.zarit[0];

            try {
                let reponses = zData.reponses || [];
                if (typeof zData.reponses_json === 'string') {
                    try { reponses = JSON.parse(zData.reponses_json); } catch(e){}
                }

                const payload = {
                    dossier_id: zData.dossier_id || '',
                    senior_nom: zData.senior_nom || 'Senior non renseigné',
                    aidant_nom: zData.aidant_nom || 'Aidant',
                    score: zData.score || 0,
                    niveau: zData.niveau || 'Charge faible',
                    date: zData.date_creation || '',
                    reponses: reponses
                };

                const res = await fetch('/api/zarit/generate_pdf', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    const blob = await res.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `Grille_Zarit_${zData.dossier_id}_Score_${zData.score}.pdf`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(url);
                }
            } catch(e) {
                console.error(e);
            }
        }

        // --- INITIALISATION ---
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('theme-toggle');
            const currentTheme = localStorage.getItem('theme') || 'dark';
            
            const iconMoon = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`;
            const iconSun = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`;
            
            if (currentTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                themeToggle.innerHTML = iconMoon;
            } else {
                document.documentElement.removeAttribute('data-theme');
                themeToggle.innerHTML = iconSun;
            }

            themeToggle.addEventListener('click', () => {
                if (document.documentElement.hasAttribute('data-theme')) {
                    document.documentElement.removeAttribute('data-theme');
                    localStorage.setItem('theme', 'dark');
                    themeToggle.innerHTML = iconSun;
                } else {
                    document.documentElement.setAttribute('data-theme', 'light');
                    localStorage.setItem('theme', 'light');
                    themeToggle.innerHTML = iconMoon;
                }
            });

            // Hamburger menu
            const menuToggle = document.getElementById('menu-toggle');
            const dropdownMenu = document.getElementById('dropdown-menu');
            if (menuToggle && dropdownMenu) {
                menuToggle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    dropdownMenu.classList.toggle('hidden');
                });
                document.addEventListener('click', () => dropdownMenu.classList.add('hidden'));
            }

            // Charger les détails du dossier
            loadDossierDetails();
        });
    </script>
</body>
</html>
