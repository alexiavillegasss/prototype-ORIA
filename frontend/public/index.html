<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORIA — Orientation Intelligente</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface2: #334155;
            --border: rgba(59, 130, 246, 0.2);
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #3b82f6;
            --accent-bright: #60a5fa;
            --gradient-1: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            --gradient-2: linear-gradient(135deg, #3b82f6 0%, #2563eb 50%, #1d4ed8 100%);
            --shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            --glow: 0 0 40px rgba(37, 99, 235, 0.15);
        }

        body.light-theme {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface2: #f1f5f9;
            --border: rgba(37, 99, 235, 0.1);
            --text: #0f172a;
            --text-dim: #64748b;
            --accent: #2563eb;
            --accent-bright: #3b82f6;
            --gradient-1: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            --gradient-2: linear-gradient(135deg, #2563eb 0%, #3b82f6 50%, #60a5fa 100%);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            --glow: 0 0 40px rgba(37, 99, 235, 0.05);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Animated background orbs - adjusted for light mode */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            z-index: 0;
            animation: float 20s ease-in-out infinite;
        }
        body::before {
            width: 500px; height: 500px;
            background: #2563eb;
            top: -100px; left: -100px;
        }
        body::after {
            width: 400px; height: 400px;
            background: #60a5fa;
            bottom: -50px; right: -50px;
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 780px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .logo-img {
            max-width: 320px;
            height: auto;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            color: var(--text-dim);
            font-size: 0.95rem;
            font-weight: 400;
            margin-top: -0.5rem;
        }

        /* Theme Toggle */
        .theme-toggle {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--shadow);
            z-index: 10;
            font-size: 1.2rem;
        }
        .theme-toggle:hover {
            transform: scale(1.05);
            border-color: var(--accent);
        }

        /* Card */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        textarea {
            width: 100%;
            min-height: 160px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.25rem;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            line-height: 1.7;
            resize: vertical;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }
        textarea::placeholder { color: var(--text-dim); opacity: 0.6; }

        /* Button */
        .btn-analyze {
            width: 100%;
            margin-top: 1.25rem;
            padding: 1rem;
            background: var(--gradient-2);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-analyze:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.35);
        }
        .btn-analyze:active:not(:disabled) { transform: translateY(0); }
        .btn-analyze:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Spinner */
        .spinner {
            width: 20px; height: 20px;
            border: 2.5px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Results */
        #results { display: none; }

        .result-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .result-badge {
            padding: 0.6rem 1.4rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: 0.02em;
            background: var(--gradient-2);
            color: #fff;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
        }
        .result-label {
            font-size: 0.85rem;
            color: var(--text-dim);
            line-height: 1.4;
        }
        .result-label strong {
            display: block;
            font-size: 1.05rem;
            color: var(--text);
        }

        /* Info rows */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .info-chip {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.85rem 1rem;
        }
        .info-chip .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-dim);
            margin-bottom: 0.25rem;
        }
        .info-chip .value {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--accent-bright);
        }

        /* Justification */
        .justification {
            background: var(--surface2);
            border-left: 3px solid var(--accent);
            border-radius: 0 12px 12px 0;
            padding: 1.25rem;
            line-height: 1.7;
            color: var(--text);
            font-size: 0.92rem;
            margin-bottom: 1.5rem;
        }
        .justification-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        /* Signals */
        .signals-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .signal-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.4rem 0.85rem;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 500;
        }
        .signal-tag.active {
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent-bright);
            border: 1px solid rgba(99, 102, 241, 0.25);
        }
        .signal-tag.inactive {
            background: rgba(100, 116, 139, 0.1);
            color: var(--text-dim);
            border: 1px solid rgba(100, 116, 139, 0.15);
            opacity: 0.5;
        }

        /* Complements */
        .complements { margin-top: 1rem; }
        .complement-item {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.85rem 1rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .complement-badge {
            padding: 0.3rem 0.7rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-bright);
            border: 1px solid rgba(59, 130, 246, 0.25);
        }
        .complement-text {
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        /* Refinement Questions */
        .refinement-section {
            margin-top: 1rem;
            display: none;
        }
        .question-card {
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.2s;
            animation: slideIn 0.4s ease-out forwards;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .question-card:hover {
            background: rgba(59, 130, 246, 0.12);
            transform: translateX(5px);
            border-color: var(--accent);
        }
        .question-icon {
            font-size: 1.4rem;
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.3));
        }
        .question-text {
            font-size: 0.95rem;
            color: var(--text);
            font-weight: 500;
            line-height: 1.4;
        }

        /* Error */
        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5;
            border-radius: 12px;
            padding: 1rem;
            font-size: 0.9rem;
            display: none;
        }

        /* Examples */
        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .example-btn {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-size: 0.78rem;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }
        .example-btn:hover {
            border-color: var(--accent);
            color: var(--accent-bright);
            background: rgba(99, 102, 241, 0.08);
        }

        /* Complexity bar */
        .complexity-bar-wrap {
            margin-bottom: 1.5rem;
        }
        .complexity-bar-bg {
            height: 8px;
            background: var(--surface2);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 0.5rem;
        }
        .complexity-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.8s ease;
        }

        @media (max-width: 600px) {
            .info-grid { grid-template-columns: 1fr; }
            .card { padding: 1.5rem; }
        }

        /* Fade-in animation */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeUp 0.5s ease forwards; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Theme Toggle -->
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Changer le thème">
            <span id="themeIcon">🌙</span>
        </button>

        <!-- Header -->
        <div class="header">
            <img src="logo_oria.svg" alt="ORIA Logo" class="logo-img">
            <p class="subtitle">Décrivez une situation, obtenez une orientation adaptée</p>
        </div>

        <!-- Input Card -->
        <div class="card">
            <div class="card-title">📝 Description de la situation</div>
            <textarea id="situationInput" placeholder="Ex : Madame Dupont, 78 ans, vit seule. Elle a chuté récemment et son fils est épuisé. Elle refuse les aides proposées..."></textarea>

            <div class="examples">
                <button class="example-btn" onclick="fillExample(0)">👵 Personne âgée isolée</button>
                <button class="example-btn" onclick="fillExample(1)">🚨 Situation d'urgence</button>
                <button class="example-btn" onclick="fillExample(2)">🏥 Retour d'hospitalisation</button>
                <button class="example-btn" onclick="fillExample(3)">📋 Problème social</button>
            </div>

            <button class="btn-analyze" id="btnAnalyze" onclick="analyzeText()">
                <span class="spinner" id="spinner"></span>
                <span id="btnLabel">Analyser la situation</span>
            </button>
        </div>

        <!-- Error -->
        <div class="error-msg" id="errorMsg"></div>

        <!-- Results -->
        <div id="results">
            <div class="card fade-in">
                <div class="card-title">🎯 Orientation recommandée</div>
                
                <!-- Refinement Questions -->
                <div class="refinement-section" id="refinementSection">
                    <div id="questionsList"></div>
                    <div style="height: 1.5rem;"></div>
                </div>

                <div class="result-header">
                    <div class="result-badge" id="orientationType">—</div>
                    <div class="result-label">
                        <strong id="orientationName">—</strong>
                        <span id="orientationObjective">—</span>
                    </div>
                </div>

                <div class="info-grid">
                    <div class="info-chip">
                        <div class="label">Pertinence</div>
                        <div class="value" id="pertinence">—</div>
                    </div>
                    <div class="info-chip">
                        <div class="label">Priorité</div>
                        <div class="value" id="priorite">—</div>
                    </div>
                </div>

                <div class="complexity-bar-wrap">
                    <div class="info-chip" style="margin-bottom: 0.5rem;">
                        <div class="label">Score de complexité</div>
                        <div class="value" id="complexityScore">—</div>
                    </div>
                    <div class="complexity-bar-bg">
                        <div class="complexity-bar-fill" id="complexityBar" style="width: 0%;"></div>
                    </div>
                </div>

                <div class="justification">
                    <div class="justification-title">💡 Explication de l'orientation</div>
                    <div id="justificationText">—</div>
                </div>

                <div id="complementsSection" style="display:none;">
                    <div class="card-title" style="margin-top:0.5rem;">➕ Orientations complémentaires</div>
                    <div class="complements" id="complementsList"></div>
                </div>
            </div>

            <div class="card fade-in" style="animation-delay: 0.15s;">
                <div class="card-title">🔍 Signaux détectés</div>
                <div class="signals-list" id="signalsList"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';

        const EXAMPLES = [
            "Madame Martin, 82 ans, vit seule dans un appartement au 3ème étage sans ascenseur. Elle a chuté la semaine dernière et son isolement est important. Pas de famille proche.",
            "Monsieur Bernard, 70 ans, victime de violences psychologiques de la part de son aide à domicile. Situation urgente, il est sous curatelle et présente des signes de maltraitance.",
            "Madame Lefebvre, 75 ans, retour d'hospitalisation suite à une fracture du col du fémur. Son mari aidant est épuisé. Autonomie fortement diminuée.",
            "Monsieur Petit, 45 ans, en grande précarité, sans médecin traitant. Problèmes financiers importants, droits sociaux non ouverts, isolement critique."
        ];

        const SIGNAL_LABELS = {
            isolement: "🏠 Isolement",
            chute: "⚠️ Chute",
            age_risk: "👴 Risque lié à l'âge",
            retour_hospit: "🏥 Retour hospitalisation",
            urgence_medicale: "🚑 Urgence médicale",
            violence_danger: "🚨 Violence / Danger",
            logement_insalubre: "🏚️ Logement insalubre",
            troubles_cognitifs: "🧠 Troubles cognitifs",
            presence_mandataire: "⚖️ Mesure de protection",
            refus_aide: "🚫 Refus d'aide",
            epuisement_aidant: "😮‍💨 Épuisement aidant"
        };

        const JUSTIFICATIONS = {
            CEV: "Orientation vers la CEV car la situation fait apparaître une vulnérabilité forte, un risque de danger, de maltraitance, de spoliation ou un habitat gravement dégradé.",
            CRT: "Orientation vers le CRT car la situation correspond à une personne âgée avec perte d'autonomie, dans une logique de maintien à domicile renforcé et besoin d'appui territorial ou intensif.",
            CLIC: "Orientation vers le CLIC car la situation relève d'un besoin d'information, d'aides, de services à domicile ou de coordination gérontologique de premier niveau.",
            CCAS: "Orientation vers le CCAS car la situation relève d'un besoin de proximité, d'aide sociale simple, de domiciliation ou d'aide du quotidien.",
            UTS: "Orientation vers l'UTS car la problématique dominante est sociale, administrative ou liée à l'ouverture de droits, sans perte d'autonomie majeure.",
            CPTS: "Orientation vers la CPTS car la situation met en évidence une difficulté d'accès au médecin traitant, à la prévention ou à l'accès aux soins de ville.",
            DAC: "Orientation vers le DAC car la situation présente une complexité médico-sociale, un risque de rupture ou un besoin de coordination soutenue ou intensive."
        };

        function fillExample(i) {
            document.getElementById('situationInput').value = EXAMPLES[i];
        }

        async function analyzeText() {
            const text = document.getElementById('situationInput').value.trim();
            if (!text) return;

            const btn = document.getElementById('btnAnalyze');
            const spinner = document.getElementById('spinner');
            const label = document.getElementById('btnLabel');
            const errorEl = document.getElementById('errorMsg');
            const resultsEl = document.getElementById('results');

            btn.disabled = true;
            spinner.style.display = 'block';
            label.textContent = 'Analyse en cours…';
            errorEl.style.display = 'none';
            resultsEl.style.display = 'none';

            try {
                const res = await fetch(`${API_URL}/analyze`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                if (!res.ok) throw new Error(`Erreur serveur (${res.status})`);
                const data = await res.json();
                renderResults(data);
            } catch (err) {
                errorEl.textContent = `❌ ${err.message}. Vérifiez que le serveur ORIA tourne sur ${API_URL}`;
                errorEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
                label.textContent = 'Analyser la situation';
            }
        }

        function renderResults(data) {
            const orient = data.orientation?.proposition_principale || {};
            const type = orient.type_structure || 'N/A';

            document.getElementById('orientationType').textContent = type;
            document.getElementById('orientationName').textContent = orient.nom_structure || type;
            document.getElementById('orientationObjective').textContent =
                (orient.objectif_orientation || '').replace(/_/g, ' ');

            document.getElementById('pertinence').textContent =
                (orient.niveau_pertinence || '—').replace(/_/g, ' ');
            document.getElementById('priorite').textContent =
                (orient.priorite_traitement || '—').replace(/_/g, ' ');

            // Justification
            const justif = JUSTIFICATIONS[type] || data.orientation?.justification_detaillee || 'Aucune explication disponible.';
            document.getElementById('justificationText').textContent = justif;

            // Complexity
            const score = data.complexite?.score_total || 0;
            const niveau = data.complexite?.niveau || 'non_complexe';
            document.getElementById('complexityScore').textContent = `${score} — ${niveau.replace(/_/g, ' ')}`;
            const pct = Math.min(score / 15 * 100, 100);
            const bar = document.getElementById('complexityBar');
            bar.style.width = pct + '%';
            bar.style.background = score >= 10 ? '#ef4444' : score >= 5 ? '#f59e0b' : '#22c55e';

            // Signals
            const signalsList = document.getElementById('signalsList');
            signalsList.innerHTML = '';
            const signals = {};
            (data.signaux_detectes || []).forEach(s => signals[s.categorie] = true);
            Object.entries(SIGNAL_LABELS).forEach(([key, label]) => {
                const active = signals[key] || false;
                const tag = document.createElement('span');
                tag.className = `signal-tag ${active ? 'active' : 'inactive'}`;
                tag.textContent = `${label}${active ? ' ✓' : ''}`;
                signalsList.appendChild(tag);
            });

            // Complements
            const comps = data.orientation?.propositions_complementaires || [];
            const compSection = document.getElementById('complementsSection');
            const compList = document.getElementById('complementsList');
            compList.innerHTML = '';
            if (comps.length > 0) {
                compSection.style.display = 'block';
                comps.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'complement-item';
                    div.innerHTML = `<span class="complement-badge">${c.type_structure || '?'}</span>
                        <span class="complement-text">${(c.objectif_orientation || '').replace(/_/g, ' ')}</span>`;
                    compList.appendChild(div);
                });
            } else {
                compSection.style.display = 'none';
            }

            // Questions d'affinage
            const questions = data.orientation?.questions_affinage || [];
            const refSection = document.getElementById('refinementSection');
            const refList = document.getElementById('questionsList');
            refList.innerHTML = '';
            
            if (questions.length > 0) {
                refSection.style.display = 'block';
                questions.forEach((q, idx) => {
                    const div = document.createElement('div');
                    div.className = 'question-card';
                    div.style.animationDelay = `${idx * 0.1}s`;
                    
                    let icon = '❓';
                    if (q.toLowerCase().includes('âge')) icon = '🎂';
                    if (q.toLowerCase().includes('commune') || q.toLowerCase().includes('réside')) icon = '📍';
                    if (q.toLowerCase().includes('autonomie') || q.toLowerCase().includes('gir')) icon = '♿';
                    if (q.toLowerCase().includes('droits')) icon = '📄';
                    
                    div.innerHTML = `
                        <div class="question-icon">${icon}</div>
                        <div class="question-text">${q}</div>
                    `;
                    refList.appendChild(div);
                });
            } else {
                refSection.style.display = 'none';
            }

            document.getElementById('results').style.display = 'block';
            document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Enter key shortcut
        document.getElementById('situationInput').addEventListener('keydown', e => {
            if (e.ctrlKey && e.key === 'Enter') analyzeText();
        });

        // Theme Toggle Logic
        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            const isLight = body.classList.toggle('light-theme');
            
            icon.textContent = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        }

        // Initialize Theme
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
                document.getElementById('themeIcon').textContent = '☀️';
            }
        })();
    </script>
</body>
</html>
